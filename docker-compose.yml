# 배포용 compose.
#
#   docker compose up -d --build
#     → Caddy(80/443, Let's Encrypt 자동) + app. 이 서버의 웹서버는 Caddy 다.
#
# 앞단에 이미 nginx 같은 웹서버가 있는 서버라면 caddy 서비스를 지우고
# app 의 127.0.0.1:8000 으로 proxy_pass 하면 된다.
#
# 시크릿은 이 파일이 아니라 같은 디렉터리의 .env 에서 읽는다 (.gitignore 대상).

services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: 8000
    ports:
      # 127.0.0.1 에만 바인딩한다. 바깥에서 8000 으로 직접 못 들어온다.
      # 반드시 Caddy 를 거치게 하려는 것 (카카오 스킬은 HTTPS 필수).
      - "127.0.0.1:8000:8000"

  caddy:
    # profiles 를 걸면 안 된다. deploy/remote.sh 의 `docker compose up -d` 가
    # 이 서비스를 관리 대상에서 빼버려서, Caddy 가 한 번 내려가면 배포로 되살아나지 않는다.
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: "${DOMAIN:?DOMAIN 을 .env 에 설정하세요. 예 bot.example.com}"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data      # 발급받은 인증서. 지우면 매번 재발급 → rate limit 위험
      - caddy_config:/config
    depends_on:
      - app

volumes:
  caddy_data:
  caddy_config:
