# 배포용 compose.
#
#   CI    : IMAGE_TAG=<커밋SHA> docker compose pull && docker compose up -d --no-build
#   손으로: docker compose up -d --build        (서버에서 굽는다. 느리다)
#
# 둘 다 deploy/remote.sh 가 IMAGE_TAG 유무로 골라 돈다.
#
# TLS 종료는 호스트의 nginx 가 한다 (Cloudflare Origin 인증서).
# 이 앱은 127.0.0.1:8000 에만 붙고, nginx 가 proxy_pass 로 넘겨준다.
#   nginx 설정: deploy/nginx/bot-nolmoa.conf
#
# ⚠️ Origin CA 인증서는 브라우저가 신뢰하지 않는다.
#    Cloudflare 프록시(주황)를 켜고 SSL/TLS 를 Full (strict) 로 둬야 정상 동작한다.
#
# 시크릿은 이 파일이 아니라 같은 디렉터리의 .env 에서 읽는다 (.gitignore 대상).

services:
  app:
    # CI 는 Actions 에서 구운 이미지를 커밋 SHA 태그로 받는다.
    # 손으로 빌드하면 같은 이름에 `local` 태그가 붙는다 — 레지스트리와 섞이지 않는다.
    image: ghcr.io/kcjfgnl9205/travel-chatbot-app:${IMAGE_TAG:-local}
    build:
      context: .
      args:
        # 빌드 안에서 테스트를 돌릴지. 기본은 돈다(손으로 배포할 때의 그물).
        # CI 는 서버에서 빌드하지 않으므로 이 값을 쓰지 않는다.
        SKIP_TESTS: ${SKIP_TESTS:-0}
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: 8000
    ports:
      # 127.0.0.1 에만 바인딩한다. 바깥에서 8000 으로 직접 못 들어온다.
      - "127.0.0.1:8000:8000"
