# Oracle Cloud VM 배포용.
#
#   서버에서:  docker compose up -d --build
#
# 시크릿은 이 파일이 아니라 같은 디렉터리의 .env 에서 읽는다.
# .env 는 절대 커밋하지 않는다 (.gitignore 에 있음).

services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: 8000
    expose:
      - "8000"
    # 바깥에 직접 열지 않는다. Caddy 를 통해서만 들어온다.
    # (카카오 스킬은 HTTPS 필수라 어차피 프록시가 필요하다)

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      # .env 에서 읽는다. 없으면 여기서 바로 실패한다 (인증서 발급이 조용히 깨지는 것보다 낫다).
      # 앱 시크릿은 넘기지 않는다 — Caddy 에 필요 없다.
      DOMAIN: "${DOMAIN:?DOMAIN 을 .env 에 설정하세요. 예 bot.example.com}"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data      # 발급받은 인증서. 지우면 매번 재발급 → rate limit 위험
      - caddy_config:/config
    depends_on:
      - app

volumes:
  caddy_data:
  caddy_config:
