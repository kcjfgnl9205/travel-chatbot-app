name: Deploy to NCP Server

# main → 운영 스택 (~/travel-chatbot-app, app:8000, nginx 가 bot.nolmoa.com 으로 프록시)
#
# game-project-be 와 같은 방식이다: appleboy/ssh-action 으로 SSH 접속해서
# 서버의 배포 스크립트를 돌린다.
#
# 시크릿 이름만 다르다. game-project-be 는 ORACLE_* 를 쓰지만, 이 저장소에는
# 이미 SSH_* 로 등록해서 동작을 확인해둔 값이 있다. GitHub Secrets 는 저장 후
# 값을 다시 읽을 수 없으므로(설계상 그렇다), 굳이 이름을 맞추려고 키를 새로
# 발급하는 것보다 이미 되는 걸 쓰는 게 낫다.
on:
  push:
    branches: [main]
  workflow_dispatch:

# 배포가 겹치면 같은 컨테이너를 동시에 재생성하려다 이름 충돌로 둘 다 죽는다.
# (서버의 remote.sh 에도 flock 이 있어 이중 안전장치)
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test

  # 이미지는 **여기서** 굽는다. 서버는 받아서 갈아끼우기만 한다.
  #
  # ⚠️ 10/10 에 Oracle VM 에서 NCP 서버로 옮긴 뒤, 서버에서 굽던 빌드가 2~3분에서
  #    10분 넘게로 늘어 `Run Command Timeout` 으로 끊겼다(echo 한 줄에 16초). 서버가
  #    느린 건 고칠 수 없지만 서버에서 빌드하지 않을 수는 있다.
  #
  # test 와 **동시에** 돈다. 이미지가 먼저 올라가도 deploy 가 둘 다 기다리므로
  # 테스트가 깨진 커밋은 배포되지 않는다. 태그가 커밋 SHA 뿐이라(latest 없음)
  # 올라간 이미지를 누가 실수로 집어 갈 일도 없다.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # ⚠️ **서버 CPU 와 맞아야 한다.** 러너는 x86 이고, 다르면 컨테이너가
          #    `exec format error` 로 안 뜬다. NCP 서버가 ARM 이면 저장소 변수
          #    DEPLOY_PLATFORM=linux/arm64 로 바꾼다(QEMU 라 몇 배 느려진다).
          platforms: ${{ vars.DEPLOY_PLATFORM || 'linux/amd64' }}
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}
          # test 잡이 같은 검사를 동시에 돌린다. 여기서 또 돌릴 이유가 없다.
          build-args: SKIP_TESTS=1
          # npm ci 레이어가 매번 다시 돌지 않게 Actions 캐시에 남긴다.
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: [test, build]
    runs-on: ubuntu-latest
    permissions:
      packages: read
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMAGE_TAG: ${{ github.sha }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: IMAGE_TAG,GHCR_USER,GHCR_TOKEN
          # 서버는 이미지를 받아 갈아끼우기만 한다. 대부분 1분 안에 끝난다.
          command_timeout: 10m
          script: |
            set -e
            cd /opt/gajago

            # ⚠️ **네트워크는 가끔 흔들린다.** 실제로 한 번 `SSL connection timeout` 으로
            #    배포가 죽었고, 20분 전 같은 명령은 멀쩡히 돌았다. 세 번까지 다시 해본다.
            #
            # ⚠️ **실패하면 여기서 멈춘다.** fetch 를 못 했는데 reset 으로 넘어가면
            #    **옛 origin/main 으로 되돌려 멀쩡한 배포를 과거로 끌고 간다.**
            #    아무것도 안 하는 편이 낫다.
            fetched=0
            for attempt in 1 2 3; do
              if git fetch --prune origin; then fetched=1; break; fi
              echo "git fetch 실패 (${attempt}/3). 5초 뒤 다시."
              sleep 5
            done
            if [ "$fetched" != 1 ]; then
              echo "GitHub 에 못 붙었다. 배포를 중단한다 — 돌고 있는 버전은 그대로 둔다."
              exit 1
            fi

            git reset --hard origin/main

            # 이 잡의 GITHUB_TOKEN 으로 로그인한다. 서버에 따로 PAT 를 심을 필요가 없고,
            # 토큰은 잡이 끝나면 죽는다. 그래도 서버 디스크에 남기지 않게 끝나면 지운다.
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT

            # IMAGE_TAG 가 있으면 remote.sh 는 빌드하지 않고 그 이미지를 받는다.
            IMAGE_TAG="$IMAGE_TAG" bash deploy/remote.sh

# develop 브랜치로 개발 스택을 굴리려면 game-project-be 처럼 분기하면 된다.
# 다만 서버에 별도 디렉터리·.env·포트(예: 8001)와 nginx vhost(dev-bot.nolmoa.com)가
# 먼저 있어야 한다. 지금은 운영 스택 하나뿐이라 main 만 둔다.
