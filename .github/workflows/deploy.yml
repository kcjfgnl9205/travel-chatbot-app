name: test & deploy

on:
  push:
  pull_request:
  workflow_dispatch:

# 배포가 겹치면 git reset --hard 가 서로를 덮는다. 한 번에 하나만.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest

  deploy:
    needs: test
    # main 에 push 된 경우에만. PR 이나 다른 브랜치에서는 돌지 않는다.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: SSH 로 서버 배포
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

          if [ -n "${SSH_KNOWN_HOSTS:-}" ]; then
            # 호스트 키를 미리 고정해두면 중간자 공격을 막을 수 있다 (권장).
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            echo "::warning::SSH_KNOWN_HOSTS 미설정 — 매번 호스트 키를 새로 신뢰합니다"
            ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 600 ~/.ssh/known_hosts

          # 배포 스크립트는 저장소 버전을 그대로 넘긴다.
          # 서버에 오래된 스크립트가 남아 있어도 항상 최신으로 돈다.
          ssh -i ~/.ssh/id_deploy -p "$SSH_PORT" \
              -o BatchMode=yes -o ConnectTimeout=15 \
              "$SSH_USER@$SSH_HOST" 'bash -s' < deploy/remote.sh
