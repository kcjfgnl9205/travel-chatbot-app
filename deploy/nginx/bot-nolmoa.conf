# bot.nolmoa.com → travel-chatbot-app (Nest, 127.0.0.1:8000)
#
# 설치:
#   sudo cp deploy/nginx/bot-nolmoa.conf /etc/nginx/sites-available/
#   sudo ln -sf /etc/nginx/sites-available/bot-nolmoa.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# ⚠️ 이 설정은 **Cloudflare 프록시(주황 구름)를 켠 상태**를 전제로 한다.
#    프록시를 끄면(회색) 사용자와 카카오가 직접 오리진에 붙는다.
#    Cloudflare SSL/TLS 모드는 반드시 **Full (strict)**.
#
# ⚠️ **인증서는 Let's Encrypt(certbot) 다. 경로를 여기에 박아둔다.**
#    예전 서버는 Cloudflare Origin CA 를 `/etc/ssl/cloudflare/` 에 두었는데,
#    2026-11-03 에 만든 춘천 서버는 certbot 으로 세팅됐다. 그때 certbot 이 이 파일을
#    **직접 고쳐서** 인증서 줄을 넣었고, 저장소에는 그 사실이 안 남았다.
#    그래서 11-04 에 저장소 버전을 덮어쓰자 인증서 경로가 사라져 `nginx -t` 가
#    통째로 실패했다 — 그 파일은 이미 sites-enabled 에 링크돼 있었으므로,
#    발견이 늦었으면 **다음 재부팅에 nginx 가 안 떴다.**
#
#    교훈: certbot 이 고칠 자리를 비워두지 말고 저장소가 들고 있는다.
#
# ⚠️ **`worker_connections` 는 이 파일이 아니라 `/etc/nginx/nginx.conf` 에 있다.**
#    기본값 768 인데, 프록시는 요청당 연결을 둘 쓰므로(클라이언트+업스트림)
#    **동시 클라이언트 상한이 약 384** 가 된다. 2026-11-04 부하 시험에서 동시 300 은
#    100% 정상, 400 부터 실패가 시작된 것이 이 숫자와 맞는다. 동시 500 을 받으려면
#    거기서 올려야 한다 — 여기만 고쳐서는 안 올라간다.

# 앱으로 가는 연결을 재사용한다.
#
# ⚠️ **`Connection` 헤더를 비우지 않으면 효과가 없다.** nginx 는 기본으로 업스트림에
#    `Connection: close` 를 보내서, keepalive 를 적어둬도 매 요청마다 TCP 를 새로 연다.
#    아래 location 들이 전부 `proxy_set_header Connection "";` 를 두는 이유다 —
#    없으면 "고쳤다고 믿는데 안 고쳐진" 상태가 되고, 그건 안 고친 것보다 나쁘다.
upstream app {
    server 127.0.0.1:8000;

    keepalive          64;    # 들고 있을 유휴 연결 수
    keepalive_timeout  60s;
    keepalive_requests 1000;
}

server {
    listen 80;
    listen [::]:80;
    server_name bot.nolmoa.com;

    # ⚠️ **갱신 검증 경로는 301 로 넘기지 않는다.** certbot 의 HTTP-01 검증이 여기로
    #    들어온다. 전부 https 로 돌려버리면 갱신이 **조용히** 실패하고, 90일 뒤
    #    인증서가 만료되면서 전면 장애가 된다. 그때는 원인도 안 보인다.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Cloudflare 가 오리진으로 붙을 때는 HTTPS(Full strict)를 쓴다.
    # 80 으로 들어오는 건 직접 접근이거나 잘못된 설정이므로 올려보낸다.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # ⚠️ **backlog 는 커널 상한(`net.core.somaxconn`)에서 조용히 잘린다.**
    #    여기만 올리고 sysctl 을 안 올리면 숫자만 바뀌고 아무 일도 안 일어난다.
    #      sudo sysctl -w net.core.somaxconn=4096
    #      echo 'net.core.somaxconn=4096' | sudo tee /etc/sysctl.d/99-nginx.conf
    listen 443 ssl http2 backlog=4096;
    listen [::]:443 ssl http2 backlog=4096;
    server_name bot.nolmoa.com;

    ssl_certificate     /etc/letsencrypt/live/bot.nolmoa.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bot.nolmoa.com/privkey.pem;

    # ⚠️ **TLS 세션 재사용. 이게 없어서 동시 400 연결에서 무너졌다.**
    #
    #    2026-11-04 부하 시험: 동시 300 까지는 100% 정상이었는데 400 에서
    #    Cloudflare 525(오리진 TLS 핸드셰이크 실패)가 15.6%, 500 에서 76.8% 가 됐다.
    #    그동안 **앱은 에러를 한 번도 안 냈고 DB 왕복은 3ms 였다** — 요청이 앱까지
    #    도착하지도 못한 것이다. 병목은 앱이 아니라 이 앞단이었다.
    #
    #    세션 재사용이 꺼져 있으면 Cloudflare 가 연결을 열 때마다 전체 핸드셰이크를
    #    한다. 비대칭키 연산이라 비싸고 OCPU 1 개로는 초당 수백 번을 못 버틴다.
    #    재개된 세션은 그 연산을 건너뛴다.
    ssl_session_cache   shared:SSL:10m;   # 약 40,000 세션 분
    ssl_session_timeout 1h;
    ssl_session_tickets on;

    # 카카오 스킬 페이로드는 작다. 큰 본문을 받을 이유가 없다.
    client_max_body_size 1M;

    # 카카오 스킬 엔드포인트. **앱이 죽어 있을 때 nginx 가 대신 말풍선을 준다.**
    #
    # ⚠️ **카카오는 200 이 아니면 본문을 읽지 않고, 사용자는 아무 말도 못 받는다.**
    #    앱이 안 떠 있으면(배포 중 재시작 10~20초, 프로세스 사망) nginx 는 502 를
    #    만드는데 그게 곧 침묵이다. 침묵은 최악이다 — 사용자는 "봇이 죽었나" 하고
    #    떠나지만, 한 줄이라도 나가면 다시 물어본다.
    #
    #    nginx 는 앱과 별개 프로세스라 앱이 죽어도 살아 있다. 그래서 여기서 답할 수 있다.
    location /api/v1/kakao/ {
        proxy_pass http://app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP  $http_cf_connecting_ip;

        proxy_connect_timeout 5s;
        proxy_send_timeout    10s;
        proxy_read_timeout    10s;

        # ⚠️ `proxy_intercept_errors` 는 **일부러 안 켠다.** 켜면 앱이 스스로 낸 5xx
        #    까지 이 폴백으로 덮어써서, 진짜 장애가 "점검 중" 으로 위장된다.
        #    여기 걸리는 건 nginx 가 직접 만드는 502/504 — 즉 **앱에 못 붙은 경우**뿐이다.
        error_page 502 503 504 = @kakao_down;
    }

    # 점검 중 말풍선. 카드도 버튼도 없이 한 줄이면 된다.
    location @kakao_down {
        default_type application/json;
        # ⚠️ 200 으로 준다. 카카오에게 이건 "정상 응답" 이어야 한다.
        # ⚠️ 줄바꿈(\n)을 넣지 않는다. nginx 가 따옴표 안의 역슬래시를 어떻게 다루는지에
        #    기대면, 사용자 화면에 'n' 한 글자가 그대로 찍힐 수 있다. 한 줄로 쓴다.
        return 200 '{"version":"2.0","template":{"outputs":[{"simpleText":{"text":"지금 잠깐 점검 중이에요 🙏 1분 뒤에 다시 말 걸어주세요."}}]}}';
    }

    # 응답 흐름 문서 (docs/flows/*.html) — https://bot.nolmoa.com/flows/
    #
    # 앱을 거치지 않고 nginx 가 파일을 바로 준다. 서버의 /opt/gajago 는 배포 때마다
    # origin/main 으로 맞춰지므로(deploy/remote.sh), **push 만 하면 문서도 같이 바뀐다.**
    # 이 설정 자체를 처음 넣을 때만 서버에서 복사·reload 가 필요하다.
    #
    # ⚠️ 주소를 아는 사람은 누구나 본다. 검색엔진에만 안 걸리게 noindex 를 단다.
    location = /flows {
        return 301 /flows/;
    }
    location /flows/ {
        alias /opt/gajago/docs/flows/;
        index index.html;
        # try_files 는 일부러 안 쓴다. alias 와 같이 쓰면 경로가 어긋나는 오래된 nginx 버그가 있다.
        # 없는 파일은 nginx 가 알아서 404 를 준다.
        add_header X-Robots-Tag "noindex, nofollow" always;
        # 문서를 고쳐 push 하면 몇 분 안에 보이게. 길게 캐시할 이유가 없다.
        expires 5m;
    }

    location / {
        proxy_pass http://app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Cloudflare 가 넘겨주는 실제 방문자 IP. 지금은 저장하지 않지만 로그 분석용.
        proxy_set_header CF-Connecting-IP  $http_cf_connecting_ip;

        # 카카오 스킬 서버 응답 제한이 5초다. 그보다 오래 붙들고 있을 이유가 없다.
        proxy_connect_timeout 5s;
        proxy_send_timeout    10s;
        proxy_read_timeout    10s;
    }

    # 진단 엔드포인트만 오래 기다려준다.
    #
    # /api/v1/debug/hotel-search 는 일부러 동기로 돈다 — 발화 파싱 + 웹 검색 + 선별을
    # 다 기다려서 결과와 소요 시간을 보여주는 게 목적이다. 실제로 15~30초 걸린다.
    # 위의 10초 제한을 그대로 두면 nginx 가 먼저 끊어서 Cloudflare 504 만 보게 된다.
    #
    # ⚠️ 이 완화를 location / 로 올리면 안 된다. 카카오 스킬은 5초 안에 답해야 하고,
    #    거기서 오래 붙들고 있는 건 그 자체로 버그다.
    location /api/v1/debug/ {
        proxy_pass http://app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP  $http_cf_connecting_ip;

        # OPENAI_TIMEOUT_SECONDS(60) 보다 넉넉해야 앱의 타임아웃 메시지를 볼 수 있다.
        # nginx 가 먼저 끊으면 "왜 실패했는지"가 아니라 504 만 남는다.
        proxy_connect_timeout 5s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
        # 버퍼링을 끄면 앱이 응답을 내는 즉시 흘려보낸다.
        proxy_buffering off;
    }
}
