# bot.nolmoa.com → travel-chatbot-app (Nest, 127.0.0.1:8000)
#
# 설치:
#   sudo cp deploy/nginx/bot-nolmoa.conf /etc/nginx/sites-available/
#   sudo ln -sf /etc/nginx/sites-available/bot-nolmoa.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# ⚠️ 이 설정은 **Cloudflare 프록시(주황 구름)를 켠 상태**를 전제로 한다.
#    여기서 쓰는 건 Cloudflare Origin CA 인증서인데, 브라우저가 신뢰하지 않는다.
#    프록시를 끄면(회색) 사용자와 카카오가 직접 오리진에 붙어 인증서 오류가 난다.
#    Cloudflare SSL/TLS 모드는 반드시 **Full (strict)**.

server {
    listen 80;
    listen [::]:80;
    server_name bot.nolmoa.com;

    # Cloudflare 가 오리진으로 붙을 때는 HTTPS(Full strict)를 쓴다.
    # 80 으로 들어오는 건 직접 접근이거나 잘못된 설정이므로 올려보낸다.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name bot.nolmoa.com;

    ssl_certificate     /etc/ssl/cloudflare/nolmoa.pem;
    ssl_certificate_key /etc/ssl/cloudflare/nolmoa.key;

    # 카카오 스킬 페이로드는 작다. 큰 본문을 받을 이유가 없다.
    client_max_body_size 1M;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Cloudflare 가 넘겨주는 실제 방문자 IP. 지금은 저장하지 않지만 로그 분석용.
        proxy_set_header CF-Connecting-IP  $http_cf_connecting_ip;

        # 카카오 스킬 서버 응답 제한이 5초다. 그보다 오래 붙들고 있을 이유가 없다.
        proxy_connect_timeout 5s;
        proxy_send_timeout    10s;
        proxy_read_timeout    10s;
    }
}
